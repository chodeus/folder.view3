name: Language packs

on:
  push:
    branches: [main, beta]
    paths:
      - 'src/folder.view3/usr/local/emhttp/plugins/folder.view3/langs/**'
      - '.github/scripts/check-langs.py'
      - '.github/workflows/langs.yml'
  pull_request:
    paths:
      - 'src/folder.view3/usr/local/emhttp/plugins/folder.view3/langs/**'
      - '.github/scripts/check-langs.py'
      - '.github/workflows/langs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Language packs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check every pack against en.json
        run: python3 .github/scripts/check-langs.py src/folder.view3/usr/local/emhttp/plugins/folder.view3/langs
