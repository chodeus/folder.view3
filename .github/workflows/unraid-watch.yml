name: Unraid watch

# Checks the GraphQL operations the plugin sends against unraid/api, comments on the tracking issue when upstream
# changes something the plugin calls, and keeps its status comment current. Details: .github/unraid-watch/README.md

on:
  schedule:
    - cron: '17 22 * * *'  # 06:17 Perth
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the report in the run summary instead of commenting'
        type: boolean
        default: true
      base:
        description: 'Report from these refs instead of the saved state, e.g. unraid/api=v4.35.1 unraid/webgui=7.3.2'
        type: string
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - '.github/unraid-watch/**'
      - '.github/workflows/unraid-watch.yml'
  push:
    branches: [main, beta]
    paths:
      - 'src/**'
      - '.github/unraid-watch/**'
      - '.github/workflows/unraid-watch.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Contract${{ matrix.branch && format(' ({0})', matrix.branch) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Scheduled and manual runs check both channels; a push or pull request checks its own ref.
        branch: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["main","beta"]' || '[""]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install graphql-core
        run: pip install --require-hashes -r .github/unraid-watch/requirements.txt

      - name: Check operations and watched paths against upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/unraid-watch/watch.py contract

  watch:
    name: Report upstream changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One writer at a time: the saved position lives in the comment this job posts.
    concurrency:
      group: unraid-watch-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    outputs:
      posted: ${{ steps.report.outputs.posted }}
      title: ${{ steps.report.outputs.title }}
      summary: ${{ steps.report.outputs.summary }}
      url: ${{ steps.report.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install graphql-core
        run: pip install --require-hashes -r .github/unraid-watch/requirements.txt

      - name: Report
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          BASE: ${{ inputs.base }}
        run: |
          args=(watch --base "$BASE")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python .github/unraid-watch/watch.py "${args[@]}"

  notify:
    name: Discord
    needs: watch
    if: needs.watch.outputs.posted == 'true'
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@2a3b38cf7b999109f780ac960084f5922aae7b9b # main
    with:
      event_type: workflow
      status: info
      title: ${{ needs.watch.outputs.title }}
      description: ${{ needs.watch.outputs.summary }}
      url: ${{ needs.watch.outputs.url }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
