name: Stale issues & PRs

on:
  schedule:
    - cron: '0 5 * * *'  # daily
  workflow_dispatch:

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
      # actions/stale replaces its saved-progress cache via the caches API.
      actions: write
