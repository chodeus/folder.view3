name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Branch the code is headed for, when dispatched on a PR branch (e.g. beta). Empty = the branch it runs on.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: Lint + build
    runs-on: ubuntu-latest
    env:
      # A PR's base, a dispatch's base input, else the pushed branch: the channel the manifest is checked against.
      BRANCH: ${{ github.base_ref || inputs.base || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      # php -l on every .php and .page file, then every .github/scripts/*_test.php; a deprecation fails too
      - name: PHP syntax check and PHP tests
        run: bash .github/scripts/php_tests.sh

      - name: Every !important has its reason
        working-directory: .github/scripts
        run: |
          python3 -B -m unittest important_check_test
          python3 -B important_check.py

      - name: Variables tab tests
        run: node .github/scripts/variables_tab_test.js

      - name: Autostart tab tests
        run: node .github/scripts/autostart_api_test.js

      - name: Preview graph tests
        run: node .github/scripts/preview_graph_test.js

      - name: Preview stats tests
        run: node .github/scripts/preview_stats_test.js

      - name: Folder editor regex tests
        run: node .github/scripts/regex_held_test.js

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Folder editor DOM tests
        working-directory: .github/scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node folder_editor_dom_test.js
          node preview_pages_test.js
          node incognito_test.js
          node docker_new_folder_order_test.js
          node vm_new_folder_order_test.js
          node docker_saved_places_test.js
          node docker_reset_order_test.js
          node autostart_save_test.js
          node empty_pages_test.js
          node folder_placement_test.js
          node list_reload_test.js
          node dashboard_reload_test.js
          node theme_import_dialog_test.js
          node dropped_post_test.js
          node apply_defaults_test.js
          node settings_order_test.js
          node import_order_test.js
          node name_order_test.js
          node action_refusal_test.js
          node rename_update_test.js

      - name: Validate plugin manifest (XML)
        run: xmllint --noout folder.view3.plg

      # Each bundled library must match the upstream file vendor.json names; text is compared with LF endings, as git stores it.
      - name: Bundled libraries match vendor.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/vendor.py check

      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chodeus/chodeus-ops
          ref: 4d8f3ecd9b7803badffe354a689960c8866ce1fb # main
          path: .ops
          sparse-checkout: scripts
          persist-credentials: false

      # CHANGELOG.md must render to the committed CHANGES block for this branch's channel,
      # pluginURL must point at this branch, and the manifest md5 must match the served package.
      - name: Verify changelog, manifest and served package agree
        run: |
          channel=stable
          [ "$BRANCH" != beta ] || channel=beta
          python3 .ops/scripts/plg_release.py check \
            --changelog CHANGELOG.md --plg folder.view3.plg \
            --channel "$channel" --branch "$BRANCH" --verify-asset

      - name: Test build
        run: |
          bash pkg_build.sh --version 0000.00.00 --branch "$BRANCH"
          test -f dist/folder.view3-0000.00.00-x86_64-1.txz

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      # Every GraphQL call must stay readable by the upstream watcher: .github/unraid-watch/README.md
      - name: Unraid watch tests and scan
        run: |
          pip install --require-hashes -r .github/unraid-watch/requirements.txt
          python -m unittest discover -s .github/unraid-watch -p 'test_*.py'
          python .github/unraid-watch/watch.py check

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Unraid ships 8.3 up to 7.2.7 and in 7.3.0, 8.4 from 7.2.8, 7.3.1 and 7.4; 8.5 is ahead of every release
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: PHP syntax check and PHP tests
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: docker run --rm -v "$PWD:/repo" -w /repo "php:${PHP_VERSION}-cli" bash .github/scripts/php_tests.sh

  unraid:
    name: Unraid ${{ matrix.unraid }}${{ matrix.row && format(' ({0})', matrix.row) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest release of each minor from the .plg's min, on the PHP that release ships
        include:
          - {unraid: '7.0.1', php: '8.3'}
          - {unraid: '7.1.4', php: '8.3'}
          - {unraid: '7.2.7', php: '8.3'}
          - {unraid: '7.3.5', php: '8.4'}
          # renovate: newest Unraid
          - {unraid: '7.4.0', php: '8.4'}
          # renovate: newest Unraid tag, betas included; a beta on a newer PHP needs its php raised by hand
          - {unraid: '7.4.0', php: '8.4', row: 'newest tag'}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout the last stable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
          path: .stable

      - name: Checkout the Unraid webGUI at this version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: unraid/webgui
          ref: ${{ matrix.unraid }}
          path: .webgui
          sparse-checkout: |
            emhttp/plugins/dynamix
            emhttp/plugins/dynamix.plugin.manager

      - name: Install, upgrade, remove and failures through Unraid's own plugin installer
        env:
          PHP_VERSION: ${{ matrix.php }}
          UNRAID_VERSION: ${{ matrix.unraid }}
        run: |
          docker build -q -t fv3-unraid --build-arg PHP="$PHP_VERSION" .github/unraid-compat
          docker run --rm --network none -v "$PWD:/repo" -w /repo fv3-unraid bash .github/unraid-compat/install_test.sh .webgui "$UNRAID_VERSION" .stable

  # One check per matrix for beta's branch protection: the version rows rename themselves as Renovate moves them
  php-compat:
    name: PHP compatibility
    needs: php
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every PHP version passed
        env:
          RESULT: ${{ needs.php.result }}
        run: '[ "$RESULT" = success ]'

  unraid-compat:
    name: Unraid compatibility
    needs: unraid
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Unraid version passed
        env:
          RESULT: ${{ needs.unraid.result }}
        run: '[ "$RESULT" = success ]'

  # A dispatched run's checks never reach the PR, so vendor-sync's run reports each gate there as a commit status.
  report:
    needs: [validate, php-compat, unraid-compat]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.base != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the results on the PR's commit
        env:
          LINT: ${{ needs.validate.result }}
          PHP: ${{ needs.php-compat.result }}
          UNRAID: ${{ needs.unraid-compat.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post() {
            local state=failure
            [ "$2" = success ] && state=success
            gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context="$1" -f target_url="$RUN_URL" -f description="CI dispatched for this PR: $2" >/dev/null
          }
          post 'Lint + build' "$LINT"
          post 'PHP compatibility' "$PHP"
          post 'Unraid compatibility' "$UNRAID"

  notify-failure:
    needs: [validate, php, unraid]
    if: failure() && github.event_name != 'pull_request' && !inputs.base
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@65484add1113c1bbc00827af7237ebe7a1837bbb # main
    with:
      event_type: build
      status: failure
      title: "❌ CI failed: ${{ github.ref_name }}"
      description: Validation failed; see the run.
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
